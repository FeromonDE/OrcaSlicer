name: Temporary Bambu plugin fetch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build_all.yml'

permissions:
  contents: read

jobs:
  fetch_bambu_networking:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract Bambu networking DLL
        shell: bash
        run: |
          set -euo pipefail
          URL='https://public-cdn.bblmw.com/upgrade/studio/plugins/02.08.02.60/72163aeb05/win_02.08.02.60.zip'
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o win_02.08.02.60.zip
          mkdir extracted
          unzip -q win_02.08.02.60.zip -d extracted
          DLL="$(find extracted -type f -iname 'bambu_networking.dll' -print -quit)"
          test -n "$DLL"
          cp "$DLL" bambu_networking.dll
          sha256sum win_02.08.02.60.zip bambu_networking.dll | tee SHA256SUMS.txt
          file bambu_networking.dll
          ls -lh bambu_networking.dll

      - name: Upload extracted DLL
        uses: actions/upload-artifact@v4
        with:
          name: bambu-networking-02.08.02.60
          path: |
            bambu_networking.dll
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
