name: Build Windows x64

on:
  pull_request:
    branches:
      - main
      - release/*
    paths:
      - 'deps/**'
      - 'deps_src/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - ".github/workflows/build_*.yml"
      - ".github/workflows/unit_tests*.yml"
      - 'build_win.bat'
      - 'scripts/test_build_win.ps1'
      - 'scripts/build_preset_cache.*'
      - 'scripts/msix/**'
      - 'tests/**'
  workflow_dispatch:
    inputs:
      build-deps-only:
        description: 'Only build dependencies (bypasses caching)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_windows_fast:
    name: Fast Windows x64 installer
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'bambu-signed-host' }}
    uses: ./.github/workflows/build_windows_fast.yml
    secrets: inherit

  check_build_script:
    name: Windows build script tests
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'bambu-signed-host' }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: 'false'
      - name: Run the build script test suite
        shell: powershell
        run: .\scripts\test_build_win.ps1

  build_windows:
    name: Build Windows x64
    needs: check_build_script
    if: ${{ !cancelled() && needs.check_build_script.result == 'success' }}
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
      compiler: clang
      build-deps-only: ${{ inputs.build-deps-only || false }}
    secrets: inherit

  unit_tests_windows_x64:
    name: Windows x64
    needs: build_windows
    if: ${{ !cancelled() && success() }}
    uses: ./.github/workflows/unit_tests.yml
    with:
      os: windows-latest
      artifact: ${{ github.sha }}-tests-windows-x64
