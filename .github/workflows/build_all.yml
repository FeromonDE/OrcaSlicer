name: Temporary BambuSource fetch

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build_all.yml'

permissions:
  contents: read

jobs:
  fetch_bambu_source:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract Bambu plugin package
        shell: bash
        run: |
          set -euo pipefail
          URL='https://public-cdn.bblmw.com/upgrade/studio/plugins/02.08.02.60/72163aeb05/win_02.08.02.60.zip'
          curl -L --fail --retry 3 --retry-delay 2 "$URL" -o plugin.zip
          mkdir extracted
          unzip -q plugin.zip -d extracted
          find extracted -maxdepth 3 -type f -printf '%P\t%s bytes\n' | sort | tee FILELIST.txt
          SRC="$(find extracted -type f \( -iname 'BambuSource.dll' -o -iname 'libBambuSource.dll' -o -iname '*BambuSource*.dll' \) -print -quit)"
          test -n "$SRC"
          cp "$SRC" ./BambuSource.dll
          sha256sum plugin.zip BambuSource.dll | tee SHA256SUMS.txt
          file BambuSource.dll
          ls -lh BambuSource.dll

      - name: Upload extracted BambuSource
        uses: actions/upload-artifact@v4
        with:
          name: bambu-source-02.08.02.60
          path: |
            BambuSource.dll
            SHA256SUMS.txt
            FILELIST.txt
          if-no-files-found: error
          retention-days: 1
